tests:
  LEGAL_ESTABLISH_LIABILITY:
    positive:
    - The evidence establishes liability against Acme Corp.
    - The company was found legally liable for the breach.
    - Acme is responsible for the damages.
    negative:
    - Acme denies it is liable.
    - No evidence establishes liability against Acme.
    - Whether Acme is liable remains pending review.
  LEGAL_CONFIRMED_VIOLATION:
    positive:
    - The audit confirmed a violation of the Act.
    - The facts satisfy the elements of negligence.
    - The report documents misconduct by two employees.
    - The conduct amounts to fraud.
    - The tribunal identified systemic misconduct.
    negative:
    - The regulator alleges a violation of the Act.
    - There is insufficient evidence of misconduct.
    - The court has not confirmed any violation.
    - The complaint alleges the conduct constitutes a violation.
  LEGAL_GUILT:
    positive:
    - The defendant is guilty of fraud.
    - He was convicted of obstruction.
    negative:
    - He was not convicted of obstruction.
    - The Crown alleges he committed the offence.
    - No finding of guilt was entered.
  LEGAL_WRONGFUL_CONDUCT:
    positive:
    - The officer acted in bad faith.
    - The company engaged in deceptive practices.
    negative:
    - The complaint alleges bad faith.
    - No evidence of dishonesty was presented.
  LEGAL_EVIDENCE_ASSERTS:
    positive:
    - The evidence demonstrates liability on the part of the defendant.
    - The facts point to misconduct by the officers.
    - There is a strong case that Acme breached the agreement.
    - The record establishes a violation.
    - The investigation revealed misconduct by two managers.
    negative:
    - The evidence is insufficient to establish liability.
    - The evidence does not show liability.
    - There is no evidence of a violation.
  LEGAL_QUANTIFIED_PROBABILITY:
    positive:
    - There is an 87% likelihood of liability.
    - The chance of guilt is roughly 3 in 4.
    negative:
    - Whether liability attaches remains subject to review.
  LEGAL_EVIDENCE_INSUFFICIENT:
    positive:
    - There is insufficient evidence of misconduct.
    - The evidence is insufficient to establish liability.
    - The record fails to prove a violation.
    negative:
    - The evidence establishes liability.
    - The record shows misconduct.
  LEGAL_ATTRIBUTED_FINDING:
    positive:
    - The tribunal found that the company breached the agreement.
    - The regulator determined that two provisions were violated.
    - The Human Rights Tribunal concluded that the policy was discriminatory.
    negative:
    - Acme breached the agreement.
    - The company violated the Act.
  LEGAL_OPINION_FRAME:
    positive:
    - In our view, the claim is likely to fail.
    - We conclude that the conduct does not satisfy the test.
    negative:
    - The conduct does not satisfy the test.
    - The claim is likely to fail.
  LEGAL_PRIMA_FACIE:
    positive:
    - There is a prima facie case of negligence.
    - The officer had reasonable grounds to believe an offence had occurred.
    negative:
    - The evidence establishes negligence.
    - The officer knew an offence had occurred.
