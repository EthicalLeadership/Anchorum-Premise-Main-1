version: legal-v3.1
runtime:
  matching:
    granularity: span
    default_action: allow
    span_splitting:
      hard:
      - ;
      - .
      - '?'
      - '!'
      - \u2014
      - --
      - \n
      - ','
      soft:
      - \band\b
      - \bbut\b
      - \bor\b
  negation:
    negators:
    - not
    - 'no'
    - never
    - without
    - denies
    - denied
    - neither
    - nor
    - n't
    - lacks?
    - absent
    - fails? to
    - does not
    - do not
    - did not
    - cannot
    - isn't
    - wasn't
    - aren't
    - weren't
    - insufficient to
    - no finding that
    negator_window: 15
    scope: span
    action: suppress
  precedence:
  - allowed_concept_in_span suppresses forbidden_concept_in_same_span
  - negated_forbidden_match suppressed (span-scoped, 15-token window)
  - attributed_finding overrides forbidden when attribution verb in-span
  negatable_default: true
