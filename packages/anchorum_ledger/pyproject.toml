[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorum-ledger"
version = "0.0.1"
description = "Anchorum Ledger Proof primitives: canonical JSON, Merkle trees, Ed25519 signing, OpenTimestamps anchoring."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.urls]
"Homepage" = "https://github.com/anchorum/anchorum-prem/main"
