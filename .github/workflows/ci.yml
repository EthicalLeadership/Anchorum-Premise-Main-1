name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # Job 1: Check venv vs requirements.lock consistency
  check-requirements:
    name: Check Requirements Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies from requirements.lock
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock --dry-run || echo "Dry run completed (expected to fail if versions differ)"
      
      - name: Verify lock file matches tree
        run: |
          pip install -r requirements.lock --quiet
          pip check
      
  # Job 2: Run Python tests
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: check-requirements
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-dev.txt
      
      - name: Run pytest
        run: |
          pytest harness/tests tests/ -v --tb=short
      
  # Job 3: Check integrity
  check-integrity:
    name: Integrity Check
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      
      - name: Run integrity check
        run: |
          python scripts/check_integrity.py --all
      
  # Job 4: Run regression guards
  run-regression-guards:
    name: Regression Guards
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      
      - name: Run all regression guards
        run: |
          bash scripts/run_all_regression_guards.sh
      
  # Job 5: Check audit freshness
  check-audit-freshness:
    name: Audit Freshness Check
    runs-on: ubuntu-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      
      - name: Run audit freshness check
        run: |
          python scripts/check_audit_freshness.py --strict
