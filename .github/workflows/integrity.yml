name: Integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    name: Source integrity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate is stdlib-only, so it runs before any dependency install.
      # Self-test first: it proves every check actually fires rather than
      # merely reporting success on a clean tree.
      - name: Gate self-test
        run: python scripts/check_integrity.py --selftest
      - name: Gate (all tracked source)
        run: python scripts/check_integrity.py --all
      # The secret scan runs before any dependency install, on the checkout as
      # committed. The version is pinned so the scanner cannot change under the
      # repository between runs.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Secret scan
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Verify the lockfile resolves
        run: pip install --dry-run -r requirements.lock
      - name: Verify the environment matches the lockfile (SBOM)
        run: python scripts/generate_sbom.py --check
      - name: Install interface dependencies
        working-directory: interface
        run: npm ci
      - name: Interface type-check
        working-directory: interface
        run: npx tsc --noEmit
      - name: Interface tests
        working-directory: interface
        run: npx vitest run

      - name: Interface production build
        working-directory: interface
        run: npm run build
