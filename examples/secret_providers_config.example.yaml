# Anchorum-prem External Secret Providers Configuration
# 
# This file demonstrates how to configure external secret providers.
# Copy this to secret_providers_config.yaml and customize for your environment.

---
# Unified Secret Manager Configuration
unified_manager:
  default_provider: VaultProvider
  cache_enabled: true
  cache_ttl_seconds: 300
  failover_enabled: true
  
  providers:
    - type: vault
      config:
        url: ${VAULT_URL:-https://vault.internal:8200}
        token: ${VAULT_TOKEN}
        method: token
        namespace: production
        mount_point: secret
        verify_ssl: true
        max_retries: 3
        retry_delay: 1.0
        
    - type: aws_secrets_manager
      config:
        region: ${AWS_REGION:-us-east-1}
        secret_id: ${AWS_SECRET_NAME}
        version_stage: latest
        iam_role_arn: ${AWS_IAM_ROLE_ARN}
        credentials_profile: default
        max_retries: 3
        
    - type: azure_key_vault
      config:
        vault_url: ${AZURE_VAULT_URL}
        auth_method: managed_identity
        client_id: ${AZURE_CLIENT_ID}
        tenant_id: ${AZURE_TENANT_ID}
        client_secret: ${AZURE_CLIENT_SECRET}

---
# Environment Variables Reference
VAULT_URL=https://vault.internal:8200
VAULT_TOKEN=your-vault-token-here
AWS_REGION=us-east-1
AWS_SECRET_NAME=my-app-secrets
AWS_IAM_ROLE_ARN=arn:aws:iam::123456789012:role/anchorum-secrets
AZURE_VAULT_URL=https://kv.example.com/
AZURE_CLIENT_ID=your-client-id
AZURE_TENANT_ID=your-tenant-id

---
# Security Best Practices
# 1. Never commit secrets to version control
# 2. Use environment variables or secret management tools
# 3. Rotate credentials regularly
# 4. Enable audit logging on all providers
# 5. Use least-privilege access policies
