# CANONICAL.yaml - Governance ↔ Runtime Interface Contract
# This file defines the canonical shape of PipelineResult and ResultStatus enums.
# It is the only legal coupling surface between Dossier Intake Source and dossier_pipeline.
# See GRIC_v1.0_INTERFACE_SPEC.md section 4 for interface contract details.

version: 1.0
runtime:
  pipeline_result:
    required:
      - status
      - message_key
      - message_id
      - actor
      - route
      - reason
      - record_hash
      - previous_hash
      - raw_sha256
    forbidden:
      - retryable
      - data
  result_status:
    allowed_values:
      - PROCESSED
      - DUPLICATE
      - QUARANTINED
      - REJECTED_POLICY
      - FAILED_RUNTIME
    deprecated: []
code:
  contracts_module: dossier_pipeline.contracts
  enums:
    - ResultStatus
    - PipelineResult
spec:
  gric_version: 1.0
  interface_contract: true
