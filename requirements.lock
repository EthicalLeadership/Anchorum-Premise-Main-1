# Exact dependency closure of the environment that passes this project's gates.
#
# Provenance: resolved and verified green on Python 3.14.4 with
#   pytest 294 passed, tsc clean, vitest 14 files / 72 tests.
# Regenerate after changing requirements.txt with:
#   uv pip compile requirements.txt -o requirements.lock
# or, if you are using plain pip:
#   pip install -r requirements.txt && pip freeze | sort > requirements.lock
#
# Install reproducibly with:
#   pip install -r requirements.lock
#
# Rationale (audit finding F-05): requirements.txt used open ">=" ranges and
# resolved to ~185 packages including torch and a full CUDA stack, so no two
# machines got the same environment and a "green" run was not reproducible.
# The heavyweight ML stack is no longer a dependency of this codebase at all;
# the closure below is the whole runtime plus the test runner.
#
# Test tooling is not split out here on purpose: a lockfile describes one
# verified environment, and pytest is part of what was verified.

